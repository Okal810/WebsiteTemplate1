<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 • Systemfehler</title>
    <link rel="stylesheet" href="/server/server.css">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #ff3333, #ff8888);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="background-effects"></div>
    <div class="error-container">
        <h1 class="error-code">500</h1>
        <p class="error-message">Interner Systemfehler aufgetreten.</p>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Das System hat den Fehler protokolliert.</p>
        <a href="/" class="home-btn">
            <i class="fas fa-redo"></i> Erneut versuchen
        </a>
    </div>
</body>

</html>
